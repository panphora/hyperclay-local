name: Release

# Builds, signs, notarizes and publishes every platform. Dispatched by
# `npm run release` after it has bumped the version and pushed the commit.
#
# Every job carries timeout-minutes. A job killed at GitHub's six hour ceiling
# reports as "cancelled", which reads like someone pressed the button rather than
# a broken build, and that hid fifteen dead runs for a week in August 2026.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being released (must match package.json at this commit)"
        required: true
        type: string
      dry_run:
        description: "Build, sign and notarize everything, but publish nothing"
        required: false
        default: false
        type: boolean

env:
  # Node 26 since 2026-08-31. This said 24 because `npm ci` on 26 produced a tree
  # where require('electron') throws, which was real but misattributed to
  # extract-zip. The bug is three levels down, in fd-slicer 1.1.0
  # (extract-zip 2.0.1 -> yauzl 2.10.0 -> fd-slicer), which sets `destroyed = true`
  # immediately before `push(null)`. Node 26 drops the bytes a destroyed Readable has
  # already buffered, so the last chunk of any zip entry over 64KB is stranded,
  # extract-zip's promise never settles, and the process exits 0 having extracted
  # nothing. The `overrides` on yauzl in package.json takes yauzl 3, which dropped
  # fd-slicer entirely; the install then works on 24 and 26 alike. Node 26 is also
  # the V8 that stops segfaulting jest workers during GC, which every Node 24 does.
  NODE_VERSION: "26"
  # Pinned because the Node image's bundled npm moves under us, and the runner should
  # install the way the release machine does. Node 26 ships npm 11.19, so this is the
  # major it already had. The earlier note here said Node 26 ships npm 12 and that
  # npm 12 ignores package.json's allowScripts approvals. Neither is true: no Node 26
  # release bundles npm 12, and the approvals were verified working under npm 12.0.2.
  # The broken tree was fd-slicer, which has the identical symptom.
  NPM_VERSION: "11"

jobs:
  # ── The dispatch and the commit must agree ──
  # A dispatch runs against a branch, not a commit, so it can pick up something
  # newer or older than the release that asked for it. Fails in seconds, before
  # any runner spends time building the wrong thing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: package.json matches the dispatched version
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "Dispatched ${{ inputs.version }}, but this commit is $ACTUAL."
            echo "This run is building a different version than the one that asked for it."
            exit 1
          fi
          echo "Releasing $ACTUAL"

  # ── Test gate, one job per shipped platform ──
  # Deliberately three jobs rather than one matrix. Each build below waits only on its
  # OWN platform's tests, so a Windows failure no longer hides whether macOS signing
  # works; `upload` still waits for all of them, so nothing reaches users unless every
  # platform is green. As a matrix this cost one unknown per run: six dry runs cancelled
  # the Windows leg before it reported, and the seventh found 14 failures nobody had
  # ever seen, because the Windows suite had in fact never run to completion here.
  test-macos:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
      # --runInBand: one process, no jest workers. V8 segfaults workers during GC and
      # jest can exit 0 after a worker dies, reporting green for the suites that did
      # finish. Serial also removes the parallel-load contention that made this suite
      # fail three times locally and pass every time in isolation.
      - run: npm test -- --runInBand


  test-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
      # --runInBand: one process, no jest workers. V8 segfaults workers during GC and
      # jest can exit 0 after a worker dies, reporting green for the suites that did
      # finish. Serial also removes the parallel-load contention that made this suite
      # fail three times locally and pass every time in isolation.
      - run: npm test -- --runInBand


  test-linux:
    needs: verify
    # Both shipped Linux arches. The arm64 runner is also what builds the arm64
    # AppImage, so this is the same environment the release binary comes from.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
      # --runInBand: one process, no jest workers. V8 segfaults workers during GC and
      # jest can exit 0 after a worker dies, reporting green for the suites that did
      # finish. Serial also removes the parallel-load contention that made this suite
      # fail three times locally and pass every time in isolation.
      - run: npm test -- --runInBand


  # ── License gate ──
  # The First Million Stays Yours License promises each version converts to plain
  # MIT by deleting a labelled clause list. A release whose residue is no longer
  # MIT would ship a promise it cannot keep.
  license:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ablation-check.py LICENSE

  # ── macOS: build both architectures, sign, notarize, staple ──
  build-macos:
    needs: [test-macos, license]
    runs-on: macos-14
    # Two architectures, each waiting on Apple's notarization queue. The long pole.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      # NOTARIZE_WAIT makes the afterSign hook wait for Apple's verdict and staple
      # before the DMG is packaged, instead of handing back a submission id for a
      # local script to poll. It also makes a rejection fail this job.
      - name: Build, sign & notarize
        env:
          NOTARIZE_WAIT: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run mac-build:run

      - run: node build-scripts/move-executables.js mac

      - name: Verify the DMGs carry a stapled ticket
        run: |
          for dmg in executables/*.dmg; do
            echo "── $dmg"
            # The disk image's own ticket, which is what Gatekeeper checks on the
            # download. Without it that check is an online one even though the app
            # inside is stapled.
            xcrun stapler validate "$dmg"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/dmgcheck
            codesign -dv --verbose=4 /tmp/dmgcheck/*.app 2>&1 | grep -E "Authority|TeamIdentifier"
            xcrun stapler validate /tmp/dmgcheck/*.app
            spctl -a -vvv -t install /tmp/dmgcheck/*.app
            hdiutil detach /tmp/dmgcheck -quiet
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: executables/
          if-no-files-found: error

  # ── Linux: AppImage, one per arch ──
  # Each arch builds on its own native runner rather than cross-building, because
  # lightningcss resolves its native binding through npm optionalDependencies at
  # install time: an arm64 AppImage assembled on an x64 runner packages the x64
  # binding, passes every CI check, and dies on the first Tailwind compile on a
  # user's machine. package.json pins no linux arch, so each runner builds its own.
  build-linux:
    needs: [test-linux, license]
    strategy:
      # Two independent native builds. A failure in one says nothing about the
      # other, and cancelling the sibling throws away the only evidence from this
      # commit about whether that arch works. `upload` needs both legs green, so
      # letting the sibling finish cannot ship a half release.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            suffix: ""
          - runner: ubuntu-24.04-arm
            arch: arm64
            suffix: "-arm64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}
      - run: npm run linux-build:run
      # The website, README and release summary all hard-code these filenames, so
      # electron-builder quietly changing its arch classifier would ship dead links.
      - name: Assert the artifact has the advertised name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="executables/HyperclayLocal-${VERSION}${{ matrix.suffix }}.AppImage"
          test -f "$FILE" || {
            echo "Expected $FILE, found:"
            ls executables/
            exit 1
          }

      # Does the thing we are about to publish actually start? ci.yml runs these
      # same checks on every push, but release.yml never waited for it, so a
      # release could and did reach the point of uploading an AppImage that CI
      # said could not launch on either arch (2026-09-02). Run here rather than
      # as a separate job because the binary under test is the one this job just
      # built, which is stronger than proving a different build of the same commit.
      - name: Install a virtual display and the browser driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          npx playwright install --with-deps chromium

      # Only `appimage-launch` gates the release, not all four checks. It is the
      # one that answers the release question - does the binary about to ship
      # start and serve, in four launch configurations including stock Ubuntu
      # 24.04's restricted user namespaces - and it has passed on both arches in
      # every run since the `::1` bind was fixed. `server-save` and `autostart`
      # ask richer questions and each flaked once in four post-fix runs (a launch
      # that prints one line and then goes quiet, cause not yet found), so they
      # stay in ci.yml where a flake costs a re-run rather than a release.
      - name: The AppImage starts and serves
        env:
          SYSTEM_MUTATIONS: "1"
          CHECKS: appimage-launch
        run: |
          export APPIMAGE="$(ls executables/HyperclayLocal-*.AppImage | head -1)"
          bash tests/linux/run-all.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-checks-${{ matrix.arch }}
          path: linux-check-artifacts/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: executables/
          if-no-files-found: error

  # ── Windows: build, sign with Azure Trusted Signing ──
  build-windows:
    needs: [test-windows, license]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Build CSS
        run: npm run build-css

      - name: Build React (production)
        run: npm run build-react-prod

      - name: Build unsigned installer
        run: npm run clean-windows && npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: Install TrustedSigning module
        run: Install-Module -Name TrustedSigning -Force -Scope CurrentUser -AcceptLicense
        shell: pwsh

      - name: Sign with Azure Trusted Signing
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $installerPath = Resolve-Path "dist\HyperclayLocal-Setup-*.exe"
          Write-Host "Signing: $installerPath"
          Invoke-TrustedSigning `
            -Endpoint "https://eus.codesigning.azure.net" `
            -CodeSigningAccountName "Hyperclay" `
            -CertificateProfileName "HyperclayLocalPublicCertProfile" `
            -Files "$installerPath" `
            -FileDigest SHA256 `
            -Verbose
        shell: pwsh

      - name: Verify signature
        run: |
          $installer = Resolve-Path "dist\HyperclayLocal-Setup-*.exe"
          $sig = Get-AuthenticodeSignature $installer
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") {
            Write-Error "Signature verification failed!"
            exit 1
          }
        shell: pwsh

      - run: node build-scripts/move-executables.js windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: executables/
          if-no-files-found: error

  # ── Publish ──
  # Every artifact lands in one directory here, which is why release-info.json can
  # finally list all four platforms and their real sizes. Before this, Windows
  # uploaded itself from its own job and never appeared in that file.
  upload:
    needs: [test-macos, test-windows, test-linux, license,
            build-macos, build-linux, build-windows]
    # A dry run still builds, signs, notarizes and verifies every platform, and the
    # installers are downloadable from the run's artifacts. It just never touches R2,
    # which is what makes it safe to prove this pipeline against a version that has
    # already shipped.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: executables
          merge-multiple: true

      - name: What is about to be published
        run: ls -lh executables/

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node build-scripts/post-build.js
