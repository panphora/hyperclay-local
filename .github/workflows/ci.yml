name: CI

# Tests on every push. Until now this repo ran its suite only on the release
# machine and inside the release itself, so a broken main was found at release
# time. That is the worst moment to find it.

on:
  push:
    branches: [main]
  pull_request:

env:
  # Node 26, matching the release workflow. See the note in release.yml for why this
  # said 24 until 2026-08-31 and what the yauzl override in package.json fixes.
  NODE_VERSION: "26"
  NPM_VERSION: "11"

jobs:
  test:
    strategy:
      # Every platform reports. A Linux-only failure is the whole reason Linux is here.
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung step must fail fast and visibly: a job killed at GitHub's six hour
    # ceiling reports as "cancelled", which reads like someone stopped it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      # Serial, though both reasons for it are now fixed: the GC segfault was V8 13.6,
      # which is every Node 24, and the "fails intermittently, passes in isolation"
      # flakiness was supertest binding its test servers on the wildcard address
      # (tests/helpers/loopback.js). Kept for one release so that a CI failure means
      # the code rather than the move to Node 26. Drop the flag once that holds.
      - run: npm test -- --runInBand

  # The conformance gate drives the Malleable HTML File host-test page against a real
  # listener, in a browser, from the host's own origin. That origin is the point: the
  # spec requires exact origin validation on every save, so a save can only be proven
  # from the origin that will be allowed to make it, and the cross-origin refusal needs
  # a real sandboxed iframe. `npm test` skips this unless HOST_GATE=1, because it wants
  # a downloaded browser and no developer should pay that on every run.
  #
  # Linux only. The gate tests the protocol this host speaks, which is the same on every
  # platform, and the matrix above already proves the suite runs everywhere.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      # playwright is already a devDependency; this downloads the browser it drives.
      - run: npx playwright install --with-deps chromium

      - run: npm test -- --runInBand tests/integration/host-gate.test.js
        env:
          HOST_GATE: "1"
          HOST_GATE_RUNNER: ${{ github.workspace }}/tests/conformance/host-test.mjs

  # The shipped AppImage, used the way a Linux user uses it: does it start on a
  # stock Ubuntu 24.04 (unprivileged user namespaces restricted, no libfuse2), does
  # its server save a document from a real browser, and does the popover render.
  # The test matrix above proves the code; this proves the download. Both shipped
  # arches, on the runners that build them.
  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Build the AppImage this runner's arch ships
        run: npm run linux-build:run

      - name: Install a virtual display and the browser driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          npx playwright install --with-deps chromium

      - name: Linux checks
        env:
          SYSTEM_MUTATIONS: "1"
        run: |
          export APPIMAGE="$(ls executables/HyperclayLocal-*.AppImage | head -1)"
          bash tests/linux/run-all.sh

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-checks-${{ matrix.runner }}
          path: linux-check-artifacts/

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ablation-check.py LICENSE

  # The production tree is what electron-builder puts inside the asar, so a finding here is
  # a finding in the shipped app. The full tree carries roughly thirty more in build and test
  # tooling that runs on our own machines against our own inputs, and gating on those means a
  # check that is red on the day it lands and ignored by the week after.
  #
  # Critical only, for the same reason. The highs that remain after the AWS SDK moved out are
  # each unreachable from the app, so failing on them would spend the gate's credibility on
  # findings we have already read. Tighten to `high` once those are gone rather than now.
  #
  # This job deliberately does not install: `npm audit` reads package-lock.json and asks the
  # registry, so the gate keeps reporting even when the tree cannot be installed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=critical
