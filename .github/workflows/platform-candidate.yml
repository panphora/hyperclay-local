  license:
    name: license
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - run: python3 scripts/ablation-check.py LICENSE
    needs:
    - verify
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - run: |-
        mkdir -p diagnostics
        status=0
        npm audit --omit=dev --audit-level=critical --json > diagnostics/audit.json || status=$?
        node -e "const fs=require('fs'),c=require('crypto');fs.writeFileSync('diagnostics/audit.sha256',c.createHash('sha256').update(fs.readFileSync('diagnostics/audit.json')).digest('hex'));"
        exit "$status"
    - uses: actions/upload-artifact@v4
      with:
        name: diagnostics-audit
        path: candidate/diagnostics/
        if-no-files-found: error
      if: always()
    needs:
    - verify
  offline-runtime:
    name: offline-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - run: node scripts/check-offline-runtime-release.mjs
    needs:
    - verify
  build-macos:
    name: build-macos
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - name: Import Developer ID certificate
      env:
        APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
        KPW="$(openssl rand -base64 24)"
        security create-keychain -p "$KPW" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KPW" "$KEYCHAIN"
        echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
          -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KPW" "$KEYCHAIN"
        security list-keychain -d user -s "$KEYCHAIN"
        security default-keychain -s "$KEYCHAIN"
        rm -f "$RUNNER_TEMP/cert.p12"
    - name: Build, sign & notarize
      env:
        NOTARIZE_WAIT: 'true'
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: npm run mac-build:run
    - run: node build-scripts/move-executables.js mac
    - name: Verify the DMGs and update zips carry a stapled ticket
      run: "stapler_validate() { for attempt in 1 2 3 4; do xcrun stapler validate \"$1\" && return 0; sleep 15; done; return 1; }\nfor dmg in executables/*.dmg; do\n  echo \"\u2500\u2500 $dmg\"\n  # The disk image's own ticket, which is what\
        \ Gatekeeper checks on the\n  # download. Without it that check is an online one even though the app\n  # inside is\
        \ stapled.\n  stapler_validate \"$dmg\"\n  hdiutil attach \"$dmg\" -nobrowse -quiet -mountpoint /tmp/dmgcheck\n\
        \  codesign -dv --verbose=4 /tmp/dmgcheck/*.app 2>&1 | grep -E \"Authority|TeamIdentifier\"\n  stapler_validate\
        \ /tmp/dmgcheck/*.app\n  spctl -a -vvv -t install /tmp/dmgcheck/*.app\n  hdiutil detach /tmp/dmgcheck -quiet\ndone\n\
        # The update zip is what electron-updater installs. Squirrel checks the code\n# signature, and the stapled ticket\
        \ lets the swapped app launch offline.\nls executables/*-mac.zip\nfor zip in executables/*-mac.zip; do\n  echo \"\u2500\
        \u2500 $zip\"\n  rm -rf /tmp/zipcheck && mkdir /tmp/zipcheck\n  ditto -x -k \"$zip\" /tmp/zipcheck\n  codesign --verify\
        \ --deep --strict --verbose=2 /tmp/zipcheck/*.app\n  stapler_validate /tmp/zipcheck/*.app\n  spctl -a -vvv -t\
        \ exec /tmp/zipcheck/*.app\ndone\n"
    - name: Retain private candidate outputs
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_CANDIDATES_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CANDIDATES_SECRET_ACCESS_KEY }}
        CANDIDATE_KEY: ${{ inputs.candidate_key }}
      run: node ../trusted/scripts/platform-candidate-outputs.js retain build-macos
    needs:
    - verify
  build-windows:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - name: Build CSS
      run: npm run build-css
    - name: Build React (production)
      run: npm run build-react-prod
    - name: Build and sign the installer
      run: npm run clean-windows && npx electron-builder --win --publish never
      env:
        NODE_ENV: production
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    - name: Verify signatures
      run: "# Azure Trusted Signing issues three-day certificates, so an untimestamped\n# signature stops validating three\
        \ days after the release and Windows then\n# treats the file as unsigned. Status is \"Valid\" here either way, because\n\
        # the certificate has not expired yet on the runner, so the timestamp is the\n# only thing that proves the signature\
        \ will still verify for a downloader.\n# electron-updater also compares the signer's CN with publisherName.\nfunction\
        \ Assert-Signed([string]$file) {\n  $sig = Get-AuthenticodeSignature -LiteralPath $file\n  Write-Host \"\u2500\u2500\
        \ $file\"\n  Write-Host \"Signature status: $($sig.Status)\"\n  Write-Host \"Signer: $($sig.SignerCertificate.Subject)\"\
        \n  if ($sig.Status -ne \"Valid\") {\n    Write-Error \"Signature verification failed: $file\"\n    exit 1\n  }\n\
        \  if ($sig.SignerCertificate.Subject -notmatch '(^|, )CN=Hyperspace Systems LLC(,|$)') {\n    Write-Error \"Signer\
        \ CN is not Hyperspace Systems LLC, so installed apps would refuse this update: $file\"\n    exit 1\n  }\n  if (-not\
        \ $sig.TimeStamperCertificate) {\n    Write-Error \"Signature has no RFC3161 timestamp; it would expire with the certificate:\
        \ $file\"\n    exit 1\n  }\n  Write-Host \"Timestamped by: $($sig.TimeStamperCertificate.Subject)\"\n}\n\n$installer\
        \ = (Resolve-Path \"dist\\HyperclayLocal-Setup-*.exe\").Path\nAssert-Signed $installer\nAssert-Signed \"dist\\win-unpacked\\\
        HyperclayLocal.exe\"\n\n# Without publisherName in app-update.yml, electron-updater skips the\n# signature check on\
        \ every downloaded update.\n$updateConfig = Get-Content -Raw \"dist\\win-unpacked\\resources\\app-update.yml\"\nWrite-Host\
        \ $updateConfig\nif ($updateConfig -notmatch 'publisherName:\\s*\\r?\\n\\s*-\\s*Hyperspace Systems LLC') {\n  Write-Error\
        \ \"app-update.yml does not name the publisher, so updates would not be signature-checked.\"\n  exit 1\n}\n\n# Install\
        \ silently, which the one-click installer always does per user (no UAC),\n# and check what lands on disk through the\
        \ same registry value the app reads to\n# decide it can update itself. build/installer.nsh puts a fresh install in\n\
        # Programs\\HyperclayLocal, the folder every older per-user install already uses.\nStart-Process -FilePath $installer\
        \ -ArgumentList \"/S\" -Wait\n$key = \"HKCU:\\Software\\56279e69-a1ca-58cc-a483-19be13420d85\"\n$dir = (Get-ItemProperty\
        \ -Path $key -Name InstallLocation).InstallLocation\nWrite-Host \"Installed to: $dir\"\nif ($dir -ne (Join-Path $env:LOCALAPPDATA\
        \ \"Programs\\HyperclayLocal\")) {\n  Write-Error \"The installer did not install to the per-user HyperclayLocal folder:\
        \ $dir\"\n  exit 1\n}\nAssert-Signed (Join-Path $dir \"HyperclayLocal.exe\")\nAssert-Signed (Join-Path $dir \"Uninstall\
        \ HyperclayLocal.exe\")\n\n# electron-updater reinstalls with --updated /S. The assisted installer must find\n# the\
        \ per-user install through HKCU and reinstall into the same folder.\nStart-Process -FilePath $installer -ArgumentList\
        \ \"--updated\",\"/S\" -Wait\n$again = (Get-ItemProperty -Path $key -Name InstallLocation).InstallLocation\nif ($again\
        \ -ne $dir) {\n  Write-Error \"A silent update moved the install: $dir -> $again\"\n  exit 1\n}\nAssert-Signed (Join-Path\
        \ $dir \"HyperclayLocal.exe\")\n"
