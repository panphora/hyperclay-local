  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - run: npm test -- --runInBand
    needs:
    - verify
  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: trusted
    - uses: ./trusted/.github/actions/candidate
    - run: npx playwright install --with-deps chromium
    - run: npm test -- --runInBand tests/integration/host-gate.test.js
      env:
        HOST_GATE: '1'
        HOST_GATE_RUNNER: ${{ github.workspace }}/candidate/tests/conformance/host-test.mjs
    needs:
