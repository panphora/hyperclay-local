        npm test -- --runInBand --shard=3/3 --json --outputFile=diagnostics/test-linux-arm64-3-report.json
    - run: node ../trusted/scripts/release-test-shard.js verify --list diagnostics/test-linux-arm64-3-list.json --report diagnostics/test-linux-arm64-3-report.json
        --shard 3/3
