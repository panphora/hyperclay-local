name: launch-soak

on:
  workflow_dispatch:

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm ci --no-audit --no-fund && ./node_modules/.bin/install-electron --no || true
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gdb
          npx playwright install-deps chromium
          npm run browser:install && node scripts/chrome-for-testing/configure-linux-sandbox.cjs
      - run: npm run linux-build:run > build.log 2>&1 || { tail -30 build.log; exit 1; }
      - name: soak
        run: |
          set +e
          out="$PWD/soak"; mkdir -p "$out"; export LINUX_CHECK_OUT="$out/lc"; mkdir -p "$LINUX_CHECK_OUT"
          { uname -a; echo "mmap_rnd_bits=$(sysctl -n vm.mmap_rnd_bits)"; echo "userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"; nproc; free -m; } | tee "$out/result.txt"
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p; ulimit -c unlimited
          export APPIMAGE="$(ls -t "$PWD"/executables/*.AppImage | head -1)"
          (mkdir -p /tmp/x && cd /tmp/x && "$APPIMAGE" --appimage-extract >/dev/null)
          BIN="$(find /tmp/x/squashfs-root -maxdepth 1 -type f -name '*.bin' -size +50M | head -1)"; echo "BIN=$BIN" | tee -a "$out/result.txt"
          bad=0; for i in $(seq 1 200); do unshare -Ur true 2>/dev/null || bad=$((bad+1)); done; echo "unshare -Ur failed $bad of 200" | tee -a "$out/result.txt"
          case "$(uname -m)" in aarch64) old=HyperclayLocal-1.34.1-arm64.AppImage;; *) old=HyperclayLocal-1.34.1.AppImage;; esac
          mkdir -p /tmp/old && curl -fsSL -o "/tmp/old/$old" "https://local.hyperclay.com/$old" && chmod +x "/tmp/old/$old"; ls -la "/tmp/old/$old" | tee -a "$out/result.txt"; NEW="$APPIMAGE"; OLD="/tmp/old/$old"
          source tests/linux/lib.sh; set +e; trap - EXIT
          variant() { local name="$1" n="$2"; shift 2; local ok=0 bad=0 codes="" i
            for i in $(seq 1 "$n"); do local home; home="$(fresh_home "$name-$i")"; launch "$home" "$@" >/dev/null; local pid; pid="$(cat "$LAB/app.pid")"; local up=0 t=0
              while [ $t -lt 120 ]; do curl -s -o /dev/null -m 1 "http://127.0.0.1:$PORT/_/meta" && { up=1; break; }; kill -0 "$pid" 2>/dev/null || break; sleep 0.25; t=$((t+1)); done
              if [ $up = 1 ]; then ok=$((ok+1)); stop "$pid"; else local c=0; if kill -0 "$pid" 2>/dev/null; then c=stuck; else wait "$pid" 2>/dev/null || c=$?; fi; bad=$((bad+1)); codes="$codes $c"; { echo "--- $name #$i status $c"; tail -30 "$LAB/app.log" | cut -c1-240; [ -f "$home/st.txt" ] && tail -25 "$home/st.txt" | cut -c1-240; } >> "$out/result.txt"; stop "$pid"
                for core in /tmp/core.*; do [ -f "$core" ] || continue; gdb -q -batch -ex 'info proc mappings' -ex bt -ex 'x/3i $pc' -ex 'thread apply all x/i $pc' "$BIN" "$core" 2>&1 | grep -aE 'electron.bin|^#|=> |signal|Thread' | head -60 | cut -c1-200 > "$out/bt-$name-$i.txt"; sudo rm -f "$core"; done; fi
              sudo rm -f /tmp/core.* 2>/dev/null; rm -rf "$home" 2>/dev/null; done
            echo "$name n=$n ok=$ok bad=$bad codes:$codes" | tee -a "$out/result.txt"; }
          bare() { local v="$1" n="$2" name="$3"; shift 3; local d="/tmp/bare-$v"; if [ ! -d "$d" ]; then mkdir -p "$d/app"; (cd "$d" && npm init -y >/dev/null && npm i "electron@$v" --no-audit --no-fund >/dev/null 2>&1; [ -x node_modules/electron/dist/electron ] || node node_modules/electron/install.js >/dev/null 2>&1; [ -x node_modules/electron/dist/electron ] || ./node_modules/.bin/install-electron --no-progress >/dev/null 2>&1); [ -x "$d/node_modules/electron/dist/electron" ] || { echo "$name electron@$v BINARY MISSING" | tee -a "$out/result.txt"; return; }; echo 'const{app}=require("electron");app.whenReady().then(()=>setTimeout(()=>app.quit(),300));' > "$d/app/main.js"; echo '{"name":"t","version":"1.0.0","main":"main.js"}' > "$d/app/package.json"; fi
            local bad=0 c codes=""; for i in $(seq 1 "$n"); do xvfb-run -a env ELECTRON_DISABLE_SANDBOX=1 "$d/node_modules/electron/dist/electron" --ozone-platform=x11 "$@" "$d/app" >/tmp/bare.log 2>&1; c=$?; if [ "$c" != 0 ]; then bad=$((bad+1)); codes="$codes $c"; fi; sudo rm -f /tmp/core.* 2>/dev/null; done; echo "$name electron@$v n=$n bad=$bad codes:$codes" | tee -a "$out/result.txt"; }
          for round in 1 2; do
            bare 43.8.6 100 bare-pinned
            bare 43.8.7 100 bare-latest43
            bare 38.3.0 100 bare-old
          done
          cat "$out/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.runner }}
          path: soak/
